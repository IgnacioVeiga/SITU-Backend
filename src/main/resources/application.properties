spring.application.name=SITU-Backend
spring.profiles.default=dev
app.env=${APP_ENV:${SPRING_PROFILES_ACTIVE:dev}}
app.timezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}
spring.resources.static-locations=file:src/main/resources/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.access-expiration-seconds=${JWT_ACCESS_EXPIRATION_SECONDS:900}
security.auth.refresh.expiration-seconds=${AUTH_REFRESH_EXPIRATION_SECONDS:43200}
security.auth.refresh.remember-expiration-seconds=${AUTH_REFRESH_REMEMBER_EXPIRATION_SECONDS:2592000}
security.auth.refresh.cookie.name=${AUTH_REFRESH_COOKIE_NAME:situ_refresh_token}
security.auth.refresh.cookie.path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
security.auth.refresh.cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
security.auth.refresh.cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:false}
security.auth.refresh.cookie.domain=${AUTH_REFRESH_COOKIE_DOMAIN:}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
security.data.encryption-key=${DATA_ENCRYPTION_KEY:dev-only-change-me}
security.tracking-token.hash-secret=${TRACKING_TOKEN_HASH_SECRET:dev-only-change-me}
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}

# Server
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.create-schemas=true

# Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}
spring.jackson.time-zone=${app.timezone}

# Actuator (safe defaults for production)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.shutdown.enabled=false
management.endpoint.flyway.enabled=false
management.endpoint.env.enabled=false
management.endpoints.web.base-path=/actuator
