app.env=${APP_ENV:development}

spring.application.name=SITU-Backend
spring.resources.static-locations=file:src/main/resources/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}
security.jwt.renew-threshold-minutes=${JWT_RENEW_THRESHOLD_MINUTES:15}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.max-age-hours=${COOKIE_MAX_AGE_HOURS:24}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
logging.level.org.springframework.security=INFO

# Server
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Actuator (safe defaults for production)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.shutdown.enabled=false
management.endpoint.flyway.enabled=false
management.endpoint.env.enabled=false
management.endpoints.web.base-path=/actuator
