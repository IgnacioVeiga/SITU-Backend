app.env=${APP_ENV:development}

spring.application.name=SITU-Backend
spring.resources.static-locations=file:src/main/resources/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security
security.jwt.secret=${JWT_SECRET}
security.cookie.secure=${COOKIE_SECURE:false}
security.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS}
logging.level.org.springframework.security=DEBUG

# Server
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Flyway
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/

# Postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health, info, metrics, prometheus, beans, loggers, flyway, shutdown
# detalla los checks solo si hay auth
management.endpoint.health.show-details=when_authorized
# este "shutdown" es opcional
management.endpoint.shutdown.enabled=true
management.endpoint.flyway.enabled=true
management.endpoint.env.enabled=false
management.endpoints.web.base-path=/actuator