services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: situ_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-situ_dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - situ_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${POSTGRES_DB:-situ_dev}" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  situ_postgres_data:
